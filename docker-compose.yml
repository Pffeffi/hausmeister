# Deploy z. B. ueber Compose.Manager. Werte kommen aus .env neben dieser Datei (Vorlage: .env.example).
# Nach dem Deploy: Ordner an root uebergeben und .env auf 600 setzen (siehe README, "Absichern").
services:
  hausmeister:
    build: .
    container_name: hausmeister
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/Pffeffi/hausmeister/main/assets/icon.png"
    restart: unless-stopped
    ports:
      # nur an die LAN-IP binden - kein Reverse-Proxy-Eintrag, kein Port-Forward
      - "${UNRAID_IP:?UNRAID_IP in .env setzen}:8765:8765"   # MCP (Assistent)
      - "${UNRAID_IP}:8766:8766"                             # Weboberflaeche (Besitzer)
    environment:
      UNRAID_URL: "${UNRAID_URL:-https://${UNRAID_IP}:443/graphql}"
      UNRAID_API_KEY: "${UNRAID_API_KEY:?UNRAID_API_KEY in .env setzen}"
      MCP_TOKEN: "${MCP_TOKEN:?MCP_TOKEN in .env setzen}"
      MCP_ALLOWED_HOSTS: "${UNRAID_IP}:8765"
      # Optional: Passwort fest vorgeben. Leer lassen -> Einrichtung beim ersten
      # Aufruf mit dem Code aus dem Container-Log.
      GUI_PASSWORD_HASH: "${GUI_PASSWORD_HASH:-}"
      # Nur sinnvoll zusammen mit dem Mount weiter unten: Reserve-Logquelle fuer
      # Container, die nach stderr loggen. Beides weglassen = wie bisher.
      DOCKER_LOG_DIR: "/var/lib/docker/containers"
    volumes:
      - ./config.json:/config/config.json:ro
      # Hausbuch; benanntes Volume uebernimmt den Besitzer (uid 10001) aus dem Image
      - hausmeister-data:/data
      # Optional und nur lesend: Docker-Logdateien als Reserve (stdout + stderr).
      # Diese Zeile und DOCKER_LOG_DIR gehoeren zusammen - beides weglassen = wie bisher.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100

volumes:
  hausmeister-data:
